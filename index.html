<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern SaaS Header</title>
    <meta name="description" content="A modern, responsive, sticky header component.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="#" class="logo">
                <img src="logo2.png" alt="Vishva Technologies" class="logo-image">
            </a>
            
            <!-- Navigation Center -->
            <nav class="nav-links">
                <a href="#products">Products</a>
                <a href="#solutions">Solutions</a>
                <a href="#developers">Developers</a>
                <a href="#pricing">Pricing</a>
            </nav>

            <!-- CTA Right -->
            <div class="header-actions">
                <a href="#login" class="nav-link-login">Log in</a>
                <a href="#signup" class="btn-cta">Start Free Trial</a>
                
                <!-- Mobile Menu Button -->
                <button class="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
        
        <!-- Mobile Navigation -->
        <div class="mobile-nav">
            <a href="#products">Products</a>
            <a href="#solutions">Solutions</a>
            <a href="#developers">Developers</a>
            <a href="#pricing">Pricing</a>
            <a href="#login" class="mobile-login">Log in</a>
        </div>
    </header>

    <main class="content-placeholder">
        <section class="hero">
        </section>
        <section class="section">
        </section>
        <section class="section">
        </section>
        <section class="section">
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
